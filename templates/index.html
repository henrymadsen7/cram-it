function buildReviewCard(q,idx,isCorrect){
  const concepts=q.concepts.filter(c=>c!=='general').map(c=>`<span class="tg">${c.replace(/_/g,' ')}</span>`).join('');
  
  // Table
  let tbl='';
  if(q.chart_table&&q.chart_table.includes('|')){
    const lines=q.chart_table.split('\n').filter(l=>l.trim()&&!l.trim().match(/^[\-\|:\s]+$/));
    const rows=lines.filter(l=>l.includes('|'));
    if(rows.length>0){tbl='<table class="qtable"><tbody>';rows.forEach((r,i)=>{const cells=r.split('|').map(c=>c.trim()).filter(c=>c);const tag=i===0?'th':'td';tbl+=`<tr>${cells.map(c=>`<${tag}>${c}</${tag}>`).join('')}</tr>`});tbl+='</tbody></table>'}
  }else if(q.chart_table){tbl=`<div class="figdesc">${q.chart_table}</div>`}
  
  // Figure
  let fig='';
  const graphId='review-graph-'+q.id;
  if(q.graph_spec){
    fig=`<div id="${graphId}" data-review-graph='${JSON.stringify(q.graph_spec)}' style="margin-bottom:8px"></div>`;
    if(q.figure_image)fig+=`<details style="margin-bottom:8px"><summary style="font-size:.7rem;color:var(--dm);cursor:pointer">original image</summary><img class="figimg" src="/static/${q.figure_image}"></details>`;
  }else if(q.figure_image){
    fig=`<img class="figimg" src="/static/${q.figure_image}">`;
  }
  
  // Choices with correct/wrong highlighting
  let chHTML='';
  for(const[l,t]of Object.entries(q.choices)){
    let cls='';
    if(l.toLowerCase()===q.correct_answer.toLowerCase())cls='ok';
    else if(l.toLowerCase()===q.user_answer.toLowerCase()&&!isCorrect)cls='no';
    chHTML+=`<div class="ch ${cls}" style="cursor:default;pointer-events:none"><span class="lt">${l.toUpperCase()}</span><span>${t}</span></div>`;
  }
  
  const border=isCorrect?'border-left:3px solid var(--gn)':'border-left:3px solid var(--rd)';
  const explainBtn=isCorrect?'':`<button class="btn2" style="font-size:.7rem;padding:3px 10px;margin-top:6px" onclick="explainReviewQ('${q.id}',this)">explain why</button>`;
  const similarBtn=isCorrect?'':`<button class="btn" style="font-size:.7rem;padding:4px 12px;margin-top:6px;margin-left:4px" onclick="generateSimilar('${q.id}','${q.user_answer||''}',this)">practice similar</button>`;
  
  return `<div class="qcard" style="${border};margin-bottom:8px">
    <div class="qhead">
      <span class="qnum">${q.source_exam} &middot; ${q.question_type}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--dm)">${Math.round(q.seconds)}s</span>
    </div>
    <div class="tags" style="margin-bottom:4px">${concepts}</div>
    ${fig}${tbl}
    <div class="qtxt">${q.text}</div>
    <div class="choices" style="margin-bottom:4px">${chHTML}</div>
    ${!isCorrect?`<div style="font-size:.82rem;margin-top:6px;padding:6px 8px;background:var(--bg);border-radius:var(--r)">
      <span style="color:var(--rd)">You answered: ${q.user_answer||'(blank)'}</span> &middot;
      <span style="color:var(--gn)">Correct: ${q.correct_answer}</span>
    </div>`:''}
    <div id="explain-${q.id}" style="display:flex;flex-wrap:wrap;gap:4px">${explainBtn}${similarBtn}</div>
    <div id="similar-${q.id}"></div>
  </div>`;
}

async function explainReviewQ(qid,btn){
  btn.disabled=true;btn.textContent='loading...';
  const container=document.getElementById('explain-'+qid);
  // Stream explanation from AI tutor
  const d=document.createElement('div');d.className='msg bot';
  const bubble=document.createElement('div');bubble.className='bubble streaming-cursor';
  bubble.style.cssText='font-size:.82rem;line-height:1.6;margin-top:6px;border-left:2px solid var(--ac);padding-left:10px';
  d.appendChild(bubble);container.innerHTML='';container.appendChild(d);
  try{
    const resp=await fetch('/api/agent/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:U,message:'Explain why my answer was wrong and the correct answer is right. Be concise but thorough. Show the reasoning step by step.',question_id:qid})});
    const reader=resp.body.getReader();const dec=new TextDecoder();let full='';
    while(true){
      const{done:dn,value}=await reader.read();if(dn)break;
      for(const line of dec.decode(value).split('\n')){
        if(!line.startsWith('data: '))continue;
        try{const data=JSON.parse(line.slice(6));if(data.done)break;if(data.text){full+=data.text;bubble.innerHTML=full.replace(/\n/g,'<br>');}}catch(e){}
      }
    }
    bubble.classList.remove('streaming-cursor');
  }catch(e){bubble.textContent='Error loading explanation.';bubble.classList.remove('streaming-cursor')}
}

async function reinforceExam(examId){
  const btn=document.getElementById('reinforce-btn');
  btn.disabled=true;btn.textContent='processing...';
  const r=await api('/exam_reinforce',{user_id:U,exam_id:examId});
  btn.textContent=`done! ${r.reinforced} questions fed into FSRS`;
  btn.style.background='var(--gn)';
}

    <div style="margin-top:16px;color:var(--dm);font-size:.8rem">This takes ~10 seconds</div>

function simPick(letter){
  if(simDone)return;
  simSel=letter;
  document.querySelectorAll('#sim-choices .ch').forEach(c=>c.classList.toggle('sel',c.dataset.l===letter));

async function simSubmit(){
  if(!simSel||simDone)return;
  simDone=true;
  const q=simQs[simIdx];
  const secs=Math.round((Date.now()-simT0)/1000);
  
  document.getElementById('sim-submit-btn').disabled=true;
  
  const r=await api('/answer_similar',{user_id:U,question_id:q.id,user_answer:simSel,seconds:secs});
  
  // Highlight choices
  document.querySelectorAll('#sim-choices .ch').forEach(c=>{
    if(c.dataset.l===r.correct_answer.toLowerCase())c.classList.add('ok');
    if(c.dataset.l===simSel.toLowerCase()&&!r.correct)c.classList.add('no');
  });
  
  // Store result
  simResults.push({qid:q.id,correct:r.correct,userAnswer:simSel,correctAnswer:r.correct_answer,seconds:secs});
  
  // Build result HTML
  let html=r.correct?'<div class="rbar ok">Correct!</div>':'<div class="rbar no">Wrong — correct answer: '+r.correct_answer+'</div>';
  
  if(r.explanation){

  </div>`;
  
  document.getElementById('sim-result').innerHTML=html;
}

async function simFeedback(qid,rating,btn){

// === FLASHCARDS ===
let fcData=null,fcDeck=[],fcIdx=0,fcFlipped=false,fcSessionGot=0,fcSessionLearning=0;

function fcKey(){return 'fc_progress_'+(U||'anon')}

function getFcProgress(){
  try{return JSON.parse(localStorage.getItem(fcKey())||'{}')}catch(e){return{}}
}
function saveFcProgress(prog){localStorage.setItem(fcKey(),JSON.stringify(prog))}

async function loadFlashcards(){
  if(!fcData){
    const r=await fetch('/static/flashcards.json');
    fcData=await r.json();
  }
  const prog=getFcProgress();
  const got=fcData.filter(c=>prog[c.id]==='got').length;
  const learning=fcData.filter(c=>prog[c.id]==='learning').length;
  const unseen=fcData.length-got-learning;
  
  document.getElementById('fc-summary').textContent=`${fcData.length} cards · ${got} mastered · ${learning} learning · ${unseen} new`;
  
  // Category breakdown
  const cats={};
  fcData.forEach(c=>{
    const cat=c.category||'other';
    if(!cats[cat])cats[cat]={total:0,got:0,learning:0};
    cats[cat].total++;
    if(prog[c.id]==='got')cats[cat].got++;
    if(prog[c.id]==='learning')cats[cat].learning++;
  });
  
  const catsEl=document.getElementById('fc-cats');
  catsEl.innerHTML=Object.entries(cats).sort((a,b)=>b[1].total-a[1].total).map(([cat,info])=>{
    const pct=Math.round(info.got/info.total*100);
    const color=pct>=80?'var(--gn)':pct>=40?'var(--yw)':'var(--rd)';
    return `<div style="background:var(--s1);border:1px solid var(--bd);border-radius:var(--r-sm);padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent" onclick="startCards('cat','${cat}')">
      <div style="flex:1">
        <div style="font-size:.82rem;font-weight:600">${cat.replace(/_/g,' ')}</div>
        <div style="font-size:.68rem;color:var(--dm)">${info.got}/${info.total} mastered · ${info.learning} learning</div>
      </div>
      <div style="width:50px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
        <div style="width:${pct}%;height:100%;background:${color};border-radius:3px"></div>
      </div>
      <span style="font-size:.7rem;color:${color};font-family:'IBM Plex Mono',monospace;min-width:30px;text-align:right">${pct}%</span>
    </div>`;
  }).join('');
  
  // Show start view
  document.getElementById('fc-start').style.display='';
  document.getElementById('fc-active').style.display='none';
  document.getElementById('fc-results').style.display='none';
}

function startCards(mode,catFilter){
  const prog=getFcProgress();
  let deck=[];
  
  if(mode==='all') deck=[...fcData];
  else if(mode==='learning') deck=fcData.filter(c=>prog[c.id]==='learning');
  else if(mode==='new') deck=fcData.filter(c=>!prog[c.id]);
  else if(mode==='cat') deck=fcData.filter(c=>c.category===catFilter);
  
  if(!deck.length){
    alert(mode==='learning'?'No cards marked as learning yet!':'No cards in this category!');
    return;
  }
  
  // Shuffle
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  
  fcDeck=deck;fcIdx=0;fcSessionGot=0;fcSessionLearning=0;
  document.getElementById('fc-start').style.display='none';
  document.getElementById('fc-results').style.display='none';
  document.getElementById('fc-active').style.display='flex';
  showCard();
}

function showCard(){
  if(fcIdx>=fcDeck.length){showCardResults();return}
  const card=fcDeck[fcIdx];
  fcFlipped=false;
  document.getElementById('fc-inner').style.transform='';
  document.getElementById('fc-term').textContent=card.term;
  document.getElementById('fc-def').textContent=card.definition;
  document.getElementById('fc-example').textContent=card.example||'';
  document.getElementById('fc-cat-label').textContent=card.category.replace(/_/g,' ');
  document.getElementById('fc-progress').textContent=`${fcIdx+1} / ${fcDeck.length}`;
  const freq=card.exam_frequency||'';
  const freqColor=freq==='high'?'var(--rd)':freq==='medium'?'var(--yw)':'var(--dm)';
  document.getElementById('fc-freq').innerHTML=`<span style="color:${freqColor}">●</span> ${freq} frequency on exams`;
}

function flipCard(){
  fcFlipped=!fcFlipped;
  document.getElementById('fc-inner').style.transform=fcFlipped?'rotateY(180deg)':'';
}

function markCard(status){
  const card=fcDeck[fcIdx];
  const prog=getFcProgress();
  prog[card.id]=status;
  saveFcProgress(prog);
  if(status==='got')fcSessionGot++;
  else fcSessionLearning++;
  fcIdx++;
  showCard();
}

function showCardResults(){
  document.getElementById('fc-active').style.display='none';
  document.getElementById('fc-results').style.display='';
  const total=fcSessionGot+fcSessionLearning;
  const pct=total?Math.round(fcSessionGot/total*100):0;
  document.getElementById('fc-results-title').textContent=pct>=80?'Crushing it! 🔥':pct>=50?'Good progress!':'Keep grinding!';
  
  const prog=getFcProgress();
  const totalGot=fcData.filter(c=>prog[c.id]==='got').length;
  
  document.getElementById('fc-results-stats').innerHTML=`
    <div>This session: <span style="color:var(--gn)">${fcSessionGot} got it</span> · <span style="color:var(--rd)">${fcSessionLearning} still learning</span></div>
    <div>Overall: <span style="color:var(--gn)">${totalGot}</span> / ${fcData.length} mastered (${Math.round(totalGot/fcData.length*100)}%)</div>
  `;
}

function endCards(){
  document.getElementById('fc-active').style.display='none';
  document.getElementById('fc-results').style.display='none';
  loadFlashcards();
}

// === SERVICE WORKER ===
if('serviceWorker' in navigator){navigator.serviceWorker.register('/static/sw.js').catch(()=>{});}
</script>
</body>
</html>
